# External reach for the frontend at app.project-demo.tech. TLS is issued and
# renewed automatically by cert-manager (the `letsencrypt` ClusterIssuer, DNS-01)
# into the frontend-tls secret. Routed by the nginx ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: sddp-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.project-demo.tech
      secretName: frontend-tls
  rules:
    - host: app.project-demo.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
