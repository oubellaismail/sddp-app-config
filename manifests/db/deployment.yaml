# db tier — stock Postgres (Chainguard image, non-root/zero-CVE). NOT pipeline-
# built, so it carries no first-party signature: POL-01 skips it (imageReferences
# is sddp-* only), and POL-04 admits it via its named, digest-pinned allowlist
# entry (cgr.dev/chainguard/postgres@sha256:0e79…). Image pinned by digest (ADR-004).
#
# POC storage = EPHEMERAL (emptyDir): data is wiped on pod restart. The point of
# this tier is proving deploy + POL-04 admit + backend->db connectivity, not
# durability. PHASE 2 (real-world demo): upgrade to a StatefulSet + PVC (DO block
# volume) for persistence — tracked in ACFG-002.
#
# Non-root under POL-02 (restricted): the image entrypoint defaults to root, so
# we pin runAsUser to the image's `postgres` account, uid 70 (verified from the
# image's /etc/passwd, so getpwuid resolves). PGDATA is a SUBDIR of the mounted
# emptyDir: the mount root is group-owned by 70 via fsGroup, so initdb creates
# the pgdata subdir owned by 70:70 mode 0700 (correct). /var/run/postgresql is
# already 0777 in the image, so the unix socket needs no extra volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: sddp-app
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: cgr.dev/chainguard/postgres@sha256:0e79ed78ea7dafe83f0927da91a08353433c73699ece8446187f16e04f8a46a3
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Credentials from the imperative `db-credentials` Secret (not in git —
            # created via kubectl; Week-6 External Secrets/Vault adopts it).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_DB }
            # Subdir of the emptyDir mount so initdb creates it owned by uid 70.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
