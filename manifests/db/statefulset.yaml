# db tier — stock Postgres (Chainguard image, non-root/zero-CVE). NOT pipeline-
# built, so it carries no first-party signature: POL-01 skips it (imageReferences
# is sddp-* only), and POL-04 admits it via its named, digest-pinned allowlist
# entry (cgr.dev/chainguard/postgres@sha256:0e79…). Image pinned by digest (ADR-004).
#
# PHASE 2 storage = PERSISTENT (ACFG-003). Ephemeral emptyDir (ACFG-002) is
# replaced by a StatefulSet + volumeClaimTemplate → a PersistentVolumeClaim on
# DOKS's `do-block-storage` StorageClass → a DigitalOcean Block Storage volume.
# Postgres data now survives pod restart/reschedule.
#   ⚠ COST + CLEANUP: the block volume is provisioned by the CSI driver at runtime,
#   NOT by Terraform — so `terraform destroy` tears down the cluster but ORPHANS the
#   volume (keeps charging ~$0.10/GiB/mo until deleted in the DO console). do-block-
#   storage reclaimPolicy is Delete, so a graceful `kubectl delete pvc` while the
#   cluster is alive DOES remove the DO volume; a hard `terraform destroy` does not.
#   → folded into the bring-up/teardown runbook.
#
# Non-root under POL-02 (restricted): the image entrypoint defaults to root, so
# we pin runAsUser to the image's `postgres` account, uid 70 (verified from the
# image's /etc/passwd, so getpwuid resolves). PGDATA is a SUBDIR of the mounted
# volume: the block volume's fresh ext4 root carries a root-owned `lost+found`, so
# initdb must NOT run at the mount root. fsGroup 70 (+ OnRootMismatch) chowns the
# volume root to gid 70; initdb then creates the pgdata subdir owned 70:70 mode
# 0700 (correct). /var/run/postgresql is already 0777 in the image, so the unix
# socket needs no extra volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: sddp-app
  labels:
    app: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: cgr.dev/chainguard/postgres@sha256:0e79ed78ea7dafe83f0927da91a08353433c73699ece8446187f16e04f8a46a3
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            # Credentials from the imperative `db-credentials` Secret (not in git —
            # created via kubectl; Week-6 External Secrets/Vault adopts it).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_DB }
            # Subdir of the mounted volume so initdb creates it owned by uid 70
            # (and stays clear of the block volume's root-owned lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 1Gi
