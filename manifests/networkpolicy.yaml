# Namespace isolation floor for sddp-app.
#
# This file now holds ONLY the default-deny-all floor. It is the required
# baseline that every admitted pod depends on: with no explicit allow rules,
# all ingress and egress are denied until something grants them.
#
# The explicit least-privilege allow-graph (frontend -> backend -> db + DNS)
# has moved to ciliumnetworkpolicy.yaml, which expresses the same L3/L4 graph
# as CiliumNetworkPolicy plus L7 DNS visibility on the DNS egress. Keeping the
# allow-rules out of stock NetworkPolicy avoids a plain L3 DNS allow shadowing
# the L7 DNS rule (an L3 allow is more permissive and would bypass the DNS
# proxy). Admission still sees a NetworkPolicy in this namespace, so the
# "a NetworkPolicy must exist" guardrail stays satisfied by this object alone.
#
# sync-wave "-1" so the floor exists before any pod is admitted and before any
# pod tries to talk.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sddp-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
